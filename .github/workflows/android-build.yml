name: Build Android APK (La Súper Liga)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'src/**'
      - 'icons/**'
      - 'images/**'
      - 'rive/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Instalar dependencias de Capacitor
        run: npm install

      - name: Preparar recursos web locales
        run: |
          rm -rf www
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r src icons images rive www/ 2>/dev/null || true

      - name: Crear proyecto Android de Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Poner el ícono de la liga
        run: |
          if [ -f icons/icon-512.png ]; then
            for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "android/app/src/main/res/mipmap-$size"
              cp icons/icon-512.png "android/app/src/main/res/mipmap-$size/ic_launcher.png"
              cp icons/icon-512.png "android/app/src/main/res/mipmap-$size/ic_launcher_round.png"
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          else
            echo "::warning::No se encontró icons/icon-512.png; se conserva el ícono predeterminado."
          fi

      - name: Verificar y reconstruir la firma Android
        env:
          P1: ${{ secrets.ANDROID_KEYSTORE_PART_1 }}
          P2: ${{ secrets.ANDROID_KEYSTORE_PART_2 }}
          P3: ${{ secrets.ANDROID_KEYSTORE_PART_3 }}
          P4: ${{ secrets.ANDROID_KEYSTORE_PART_4 }}
          P5: ${{ secrets.ANDROID_KEYSTORE_PART_5 }}
          P6: ${{ secrets.ANDROID_KEYSTORE_PART_6 }}
          P7: ${{ secrets.ANDROID_KEYSTORE_PART_7 }}
          P8: ${{ secrets.ANDROID_KEYSTORE_PART_8 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS_B64="${P1}${P2}${P3}${P4}${P5}${P6}${P7}${P8}"
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Faltan los secretos del keystore Android."
            exit 1
          fi
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > release.jks
          keytool -list -keystore release.jks -storepass "$KS_PASS" | grep -q "PrivateKeyEntry" || {
            echo "::error::El keystore no contiene una clave privada válida."
            exit 1
          }
          ALIAS_REAL="$(keytool -list -keystore release.jks -storepass "$KS_PASS" | grep -m1 'PrivateKeyEntry' | cut -d, -f1 | tr -d ' ')"
          echo "KEY_ALIAS_REAL=$ALIAS_REAL" >> "$GITHUB_ENV"
          mv release.jks android/release.jks

      - name: Configurar firma y versión
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          def ciBuildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
          android {
              defaultConfig {
                  versionCode 1000 + ciBuildNumber
                  versionName "3.1.${ciBuildNumber}"
              }
              signingConfigs {
                  release {
                      storeFile file('../release.jks')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KEY_ALIAS_REAL')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Compilar APK firmado
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publicar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: La-Super-Liga-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
        
