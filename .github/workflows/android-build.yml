name: Build Android APK (Local Nativa)

# El APK ahora contiene todo el frontend adentro. Es 100% nativa y offline-first.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Verificar secretos de firma
        env:
          P1: ${{ secrets.ANDROID_KEYSTORE_PART_1 }}
          P2: ${{ secrets.ANDROID_KEYSTORE_PART_2 }}
          P3: ${{ secrets.ANDROID_KEYSTORE_PART_3 }}
          P4: ${{ secrets.ANDROID_KEYSTORE_PART_4 }}
          P5: ${{ secrets.ANDROID_KEYSTORE_PART_5 }}
          P6: ${{ secrets.ANDROID_KEYSTORE_PART_6 }}
          P7: ${{ secrets.ANDROID_KEYSTORE_PART_7 }}
          P8: ${{ secrets.ANDROID_KEYSTORE_PART_8 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Largo de cada parte: P1=${#P1} P2=${#P2} P3=${#P3} P4=${#P4} P5=${#P5} P6=${#P6} P7=${#P7} P8=${#P8}"
          echo "Largo de la contraseña del almacén: ${#KS_PASS}"
          KS_B64="$P1$P2$P3$P4$P5$P6$P7$P8"
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Faltan secretos: ANDROID_KEYSTORE_PART_1 (y siguientes) o ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > release.jks
          echo "SHA-256 del archivo reconstruido: $(sha256sum release.jks | cut -d' ' -f1)"
          keytool -list -keystore release.jks -storepass "$KS_PASS" | grep -i "PrivateKeyEntry" || {
            echo "::error::La clave no tiene ninguna entrada de clave privada. Revisá que las partes estén completas y en orden."
            exit 1
          }
          ALIAS_REAL=$(keytool -list -keystore release.jks -storepass "$KS_PASS" | grep -m1 "PrivateKeyEntry" | cut -d, -f1 | tr -d ' ')
          echo "Alias detectado: $ALIAS_REAL"
          echo "KEY_ALIAS_REAL=$ALIAS_REAL" >> "$GITHUB_ENV"
          echo "Firma OK"

      - name: Crear proyecto Capacitor con recursos locales
        run: |
          # 1. Creamos la carpeta de distribución limpia
          mkdir -p public_dist
          
          # 2. Copiamos tus archivos reales del repositorio a la carpeta que empaqueta la APK
          cp index.html public_dist/ 2>/dev/null || true
          cp manifest.webmanifest public_dist/ 2>/dev/null || true
          cp -r css public_dist/ 2>/dev/null || true
          cp -r js public_dist/ 2>/dev/null || true
          cp -r data public_dist/ 2>/dev/null || true
          
          # 3. Configuramos Capacitor de forma nativa local (sin servidor remoto de Vercel)
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.lasuperliga.app",
            "appName": "La Super Liga",
            "webDir": "public_dist"
          }
          JSON
          
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          npx cap add android

      - name: Poner el ícono de la liga
        run: |
          if [ -f icons/icon-512.png ]; then
            for size in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$size
              cp icons/icon-512.png android/app/src/main/res/mipmap-$size/ic_launcher.png
              cp icons/icon-512.png android/app/src/main/res/mipmap-$size/ic_launcher_round.png
              cp icons/icon-512.png android/app/src/main/res/mipmap-$size/ic_launcher_foreground.png
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          else
            echo "::warning::No se encontró icons/icon-512.png; queda el ícono por defecto"
          fi

      - name: Configurar firma y versión
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mv release.jks android/release.jks
          cat >> android/app/build.gradle <<GRADLE

          android {
              defaultConfig {
                  versionCode ${{ github.run_number }} + 1000
                  versionName "3.0.${{ github.run_number }}"
              }
              signingConfigs {
                  release {
                      storeFile file('../release.jks')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KEY_ALIAS_REAL')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          npx cap sync android

      - name: Compilar APK firmado
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' && secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperLiga-APK-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          
